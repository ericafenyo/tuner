name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # Older Ubuntu keeps the glibc requirement low so packages run on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          cargo deb --no-build --output dist/
          cargo generate-rpm --output dist/
          tar -czf dist/bass-tuner-${GITHUB_REF_NAME}-linux-x86_64.tar.gz \
            -C target/release tuner -C "$GITHUB_WORKSPACE" README.md LICENSE NOTICE
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          $bin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin" | Select-Object -First 1
          if ($bin) { $bin.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cargo wix --no-build --nocapture --output "dist\bass-tuner-$env:GITHUB_REF_NAME-windows-x86_64.msi"
          Copy-Item target\release\tuner.exe "dist\bass-tuner-$env:GITHUB_REF_NAME-windows-x86_64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build app bundle
        run: ./scripts/make-app.sh
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "target/release/Bass Tuner.app" \
            "dist/bass-tuner-${GITHUB_REF_NAME}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
